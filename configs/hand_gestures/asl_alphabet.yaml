dataset_root: ../../data/ASL
cache_dir: ../../data/hand_gestures/alphabet
artifacts_dir: ../../artifacts/hand_gestures/alphabet
hand_model: ../../artifacts/hand_gestures/assets/hand_landmarker.task
seed: 42
landmark_device: gpu
extraction_workers: 4
flip_probability: 0.5
